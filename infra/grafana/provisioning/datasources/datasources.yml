apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    type: postgres
    uid: postgres
    url: postgres:5432
    user: ${DB_USER}
    secureJsonData: {password: "${DB_PASSWORD}"}
    jsonData: {database: hyperspectral, sslmode: disable, postgresVersion: 1600}
