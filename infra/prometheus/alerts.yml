groups:
  - name: hydranet
    rules:
      - alert: DeadLetters
        expr: increase(hs_dlq_total[15m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Messages reached the DLQ ({{ $labels.group }} / {{ $labels.topic }})"}
      - alert: NNDisagreesWithClassical
        expr: hs_nn_classical_agreement < 0.95
        for: 30m
        labels: {severity: critical}
        annotations: {summary: "HydraNet {{ $labels.task }}/{{ $labels.layer }} agreement with the classical method fell to {{ $value }}"}
      - alert: JobsBacklog
        expr: hs_jobs_active > 200
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "{{ $value }} jobs queued or running: scale the workers"}
      - alert: GatewayErrors
        expr: sum(rate(hs_http_requests_total{code=~"5.."}[5m])) / sum(rate(hs_http_requests_total[5m])) > 0.02
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "More than 2 % of API requests fail"}
      - alert: OutboxStuck
        expr: hs_outbox_pending > 50
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Jobs are not reaching Kafka (outbox backlog {{ $value }})"}
