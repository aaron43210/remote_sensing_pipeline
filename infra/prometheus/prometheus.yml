global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: api_gateway
    metrics_path: /metrics
    dns_sd_configs: [{names: [api_gateway], type: A, port: 8000}]
  - job_name: orchestrator
    dns_sd_configs: [{names: [orchestrator], type: A, port: 9100}]
  - job_name: workers
    dns_sd_configs:
      - {names: [ingestion, preprocessing, preprocessing-thermal, ml_inference, event_sink], type: A, port: 9100}
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
