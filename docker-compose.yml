version: '3.9'

# =============================================================
# OWNER: AARON
# PRODUCTION Docker Compose — Lean 4-Service Architecture
#
# Services:
#   Infrastructure:  Kafka, MinIO, Redis, PostgreSQL
#   Go Services:     api_gateway, orchestrator
#   Python Services: ingestion, preprocessing, ml_inference
#   Frontend:        React/Vite
# =============================================================

services:

  # ── Infrastructure ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [prod-net]

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Only the 3 topics needed for the Hydra pipeline
      KAFKA_CREATE_TOPICS: "raw-ingest-requests:4:1,preprocessed-multiband:8:1,ml-analyzed:4:1"
    networks: [prod-net]

  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    networks: [prod-net]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [prod-net]

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-spectral}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spectral123}
      POSTGRES_DB: hyperspectral_db
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [prod-net]

  # ── Go Services ─────────────────────────────────────────────
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    depends_on: [kafka, postgres, redis, minio]
    environment:
      PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis:6379
      DATABASE_URL: postgres://${DB_USER:-spectral}:${DB_PASSWORD:-spectral123}@postgres:5432/hyperspectral_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
    networks: [prod-net]

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    depends_on: [kafka, redis]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis:6379
    networks: [prod-net]

  # ── Python Services ──────────────────────────────────────────
  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    depends_on: [kafka, minio]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    networks: [prod-net]

  preprocessing:
    build:
      context: ./preprocessing
      dockerfile: Dockerfile
    depends_on: [kafka, minio]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    deploy:
      replicas: 4
    networks: [prod-net]

  ml_inference:
    build:
      context: ./ml_inference
      dockerfile: Dockerfile
    depends_on: [kafka, minio]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MODEL_WEIGHTS: /app/hydra_weights.pth
    deploy:
      replicas: 2
    networks: [prod-net]

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    environment:
      VITE_API_URL: http://api_gateway:8000
    networks: [prod-net]

volumes:
  minio_data:
  postgres_data:

networks:
  prod-net:
    driver: bridge
