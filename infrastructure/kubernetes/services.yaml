apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: hyperspectral
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: hyperspectral
spec:
  selector:
    app: dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: preprocessing-service
  namespace: hyperspectral
spec:
  selector:
    app: preprocessing
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  type: ClusterIP
