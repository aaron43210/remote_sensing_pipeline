name: deploy
on:
  workflow_dispatch:
    inputs:
      tag: {description: "image tag (a released v* tag)", required: true}
permissions: {id-token: write, contents: read}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag }}"}
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE }}", aws-region: us-west-2}
      - name: ship compose files and run deploy.sh over SSM
        run: |
          B64=$(tar czf - docker-compose.yml docker-compose.aws.yml infra/kafka infra/postgres scripts/deploy.sh scripts/origin_cert.sh scripts/pg_backup.sh | base64 -w0)
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.INSTANCE_ID }}" --document-name AWS-RunShellScript \
            --parameters "commands=[\"cd /opt/hydranet && echo $B64 | base64 -d | tar xzf - && bash scripts/deploy.sh ${{ inputs.tag }}\"]" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do   # up to 15 min: the first deploy downloads ~6 GB of images
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              break
            fi
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          test "$STATUS" = Success
