name: release
on:
  push: {tags: ["v*"]}
permissions: {id-token: write, contents: read}
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [api_gateway, orchestrator, ingestion, preprocessing, ml_inference, event_sink, frontend, tools, pipelines]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE }}", aws-region: us-west-2}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.svc }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/hydranet/${{ matrix.svc }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc }}
