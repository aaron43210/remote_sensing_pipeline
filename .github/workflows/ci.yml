name: ci
on:
  pull_request:
  push:
    branches:
      - pre-production
      - base
      - production
      - Test_production
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - run: test -z "$(gofmt -l api_gateway orchestrator pkg tests)"
      - run: go vet ./... && go test ./... && go build ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -c constraints.txt -r preprocessing/requirements.txt "./libs/hs_common[geo]" ./libs/hydra \
            netCDF4 pandas pytest "torch==2.5.1" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: contracts are up to date
        run: python -m hs_common.messages contracts && git diff --exit-code contracts
      - run: pytest -q libs/hydra/tests libs/hs_common/tests
      - run: cd preprocessing && pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: secrets committed to git
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Go vulnerabilities (reachable code only)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python vulnerabilities
        run: pip install pip-audit==2.7.3 && pip-audit -r constraints.txt --strict --progress-spinner off
      - name: npm vulnerabilities
        run: cd frontend && npm ci && npm audit --audit-level=high --omit=dev
      - name: container images (OS + library CVEs)
        run: |
          for svc in api_gateway orchestrator frontend ml_inference; do
            docker build -q -t scan/$svc -f $svc/Dockerfile .
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
              --exit-code 1 --severity CRITICAL --ignore-unfixed scan/$svc
          done
  e2e:
    needs: [go, python, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: model for the smoke test
        run: echo "CI trains a small model; see train.yml for the production one"
      - name: up (fixture scenes, MinIO, fake Google sign-in)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/; s/^CREDENTIALS_KEY=.*/CREDENTIALS_KEY=$(openssl rand -hex 32)/; s/^DB_PASSWORD=.*/DB_PASSWORD=ci$(openssl rand -hex 8)/; \
                  s/^AWS_ACCESS_KEY_ID=.*/AWS_ACCESS_KEY_ID=ciminio$(openssl rand -hex 4)/; s/^AWS_SECRET_ACCESS_KEY=.*/AWS_SECRET_ACCESS_KEY=$(openssl rand -hex 20)/; s/^ALLOW_FIXTURES=.*/ALLOW_FIXTURES=true/" .env
          sed -i "s|^OIDC_ISSUER=.*|OIDC_ISSUER=http://mock-oidc:9998|; s/^GOOGLE_CLIENT_ID=.*/GOOGLE_CLIENT_ID=ci-client/; \
                  s/^GOOGLE_CLIENT_SECRET=.*/GOOGLE_CLIENT_SECRET=ci-secret/; s/^ALLOWED_EMAIL_DOMAINS=.*/ALLOWED_EMAIL_DOMAINS=example.com/; \
                  s/^ADMIN_EMAIL=.*/ADMIN_EMAIL=admin@example.com/" .env
          pip install -c constraints.txt "./libs/hs_common[geo]" "./libs/hydra[training]" pandas "torch==2.5.1" --extra-index-url https://download.pytorch.org/whl/cpu
          cd training && python -m datagen --out artifacts/data --mineral-coverage 20000 --agri-lut 20000 --agri-train 20000 --thermal-scenes 60 \
            && python -m train --steps 1500 --eval-every 1500 --version v1 --out artifacts/models || true
          python -m verify_maps --model artifacts/models/v1 --data artifacts/data --emit-scenes 2 --no-landsat || true
          cd .. && docker compose --profile local --profile test up -d --build --wait
          docker compose run --rm tools python scripts/promote_model.py --force --if-missing \
            --model-dir /artifacts/models/v1 --lut /artifacts/data/agri_lut.npz
      - run: pip install requests && python tests/e2e.py --base http://localhost:3000 --jobs 3
      - name: attack tests (must all be blocked)
        run: python tests/security.py --base http://localhost:3000 --env .env
      - name: responsive layout (8 screen sizes, touch and mouse)
        run: |
          docker run --rm --network host -v $PWD/tests:/t mcr.microsoft.com/playwright/python:v1.48.0-jammy \
            sh -c "pip install -q playwright==1.48.0 && python /t/ui_responsive.py http://localhost:3000"
      - if: failure()
        run: docker compose logs --tail 200
