version: '3.8'

services:
  # ── Infrastructure ──────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: always
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-spectral}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spectral_prod_password}
      POSTGRES_DB: hyperspectral_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectral"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MLOps ────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: always
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${DB_USER:-spectral}:${DB_PASSWORD:-spectral_prod_password}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "5000:5000"
    depends_on: [postgres, minio]

  # ── Monitoring ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_dashboards:/etc/grafana/provisioning/dashboards
    depends_on: [prometheus]

  # ── Microservices ────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: ./services/ingestion/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    deploy:
      replicas: 1

  preprocessing:
    build:
      context: .
      dockerfile: ./services/preprocessing/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    deploy:
      replicas: 3

  spectral_analysis:
    build:
      context: .
      dockerfile: ./services/spectral_analysis/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    deploy:
      replicas: 4

  rtm_inversion:
    build:
      context: .
      dockerfile: ./services/rtm_inversion/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    deploy:
      replicas: 2

  ml_inference:
    build:
      context: .
      dockerfile: ./services/ml_inference/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    volumes:
      - model_storage:/models
    deploy:
      replicas: 3

  mineral_analysis:
    build:
      context: .
      dockerfile: ./services/mineral_analysis/Dockerfile
    restart: always
    depends_on:
      - kafka
      - minio
    env_file: .env.production
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import numpy; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  api_gateway:
    build:
      context: .
      dockerfile: ./services/api_gateway/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    depends_on: [kafka, postgres, redis]
    env_file: .env.production
    deploy:
      replicas: 2

  spark_batch:
    build:
      context: .
      dockerfile: ./spark/Dockerfile
    restart: on-failure
    depends_on: [minio]
    env_file: .env.production
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: ./services/frontend/Dockerfile
    restart: always
    ports:
      - "8501:80"
    depends_on: [api_gateway]
    env_file: .env.production

  # ── Thermal Processing Service (Bainty Kaur) ─────────────────────────
  thermal:
    build:
      context: .
      dockerfile: ./services/thermal/Dockerfile
    restart: always
    depends_on: [kafka, minio]
    env_file: .env.production
    ports:
      - "8092:8092"   # Prometheus metrics
    deploy:
      replicas: 2

volumes:
  zookeeper_data:
  kafka_data:
  minio_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  model_storage:

